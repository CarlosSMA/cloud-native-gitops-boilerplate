liferay-default:
  networkPolicy:
    enabled: false
  replicaCount: 1
  image:
    tag: 2025.q1.22-lts
  customEnv:
    x-license:
      - name: LIFERAY_DISABLE_TRIAL_LICENSE
        value: "true"
  customVolumeMounts:
     x-license:
        - mountPath: /etc/liferay/mount/files/deploy
          name: license
  customVolumes:
     x-license:
        - name: license
          secret:
            secretName: liferay-license
            items:
              - key: license.xml
                path: license.xml